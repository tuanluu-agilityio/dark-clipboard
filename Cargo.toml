[workspace]
members = ["crates/*", "apps/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "GPL-3.0-only"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

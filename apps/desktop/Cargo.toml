[package]
name = "dark-clipboard"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "dark-clipboard"
path = "src/main.rs"

[dependencies]
darkclip-core = { path = "../../crates/darkclip-core" }
darkclip-app = { path = "../../crates/darkclip-app" }
darkclip-platform = { path = "../../crates/darkclip-platform" }
ctrlc = "3.5.3"
# `~1.19`: the `unstable-winit-030` API is outside Slint's semver promise (Task 204 review).
slint = { version = "~1.19.0", features = ["unstable-winit-030"] }
darkclip-storage = { path = "../../crates/darkclip-storage" }

[target."cfg(windows)".dependencies]
darkclip-windows = { path = "../../crates/darkclip-windows" }
global-hotkey = "0.10.0"
tray-icon = "0.26.1"
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_IO", "Win32_Globalization", "Win32_System_RemoteDesktop", "Win32_System_Console", "Win32_System_Time", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
slint-build = "~1.19.0"

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
]

# Slint is used under its GPLv3 option (D-034). Only the Slint crates may carry it.
[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "slint"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "slint-build"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "slint-macros"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-backend-linuxkms"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-backend-selector"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-backend-testing"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-backend-winit"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-common"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-compiler"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-core"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-core-macros"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-renderer-femtovg"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-renderer-skia"

[[licenses.exceptions]]
allow = ["GPL-3.0-only"]
crate = "i-slint-renderer-software"

# Mozilla's CA root list used by the opt-in update check (Task 412, D-057). Permissive data licence.
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

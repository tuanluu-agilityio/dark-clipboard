[package]
name = "darkclip-storage"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
darkclip-core = { path = "../darkclip-core" }
png = "0.18.1"
rusqlite = { version = "0.43.0", features = ["backup", "bundled"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "~9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
boon = "0.6.1"
tempfile = "3.27.0"

[package]
name = "darkclip-windows"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
darkclip-core = { path = "../darkclip-core" }
darkclip-platform = { path = "../darkclip-platform" }
png = "0.18"
zeroize = "1.9.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Shell"] }

[package]
name = "darkclip-app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
darkclip-core = { path = "../darkclip-core" }
darkclip-platform = { path = "../darkclip-platform" }
darkclip-storage = { path = "../darkclip-storage" }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.2"

[dev-dependencies]
darkclip-fuzzgen = { path = "../darkclip-fuzzgen" }
darkclip-platform = { path = "../darkclip-platform", features = ["fake"] }
flate2 = "1.1.11"
tempfile = "3.27.0"
zip = { version = "~9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

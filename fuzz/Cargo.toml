# cargo-fuzz targets (Task 406). Not a workspace member (see the root `exclude`), so the
# quality gate and `cargo deny` never build it; it needs a nightly toolchain and
# `cargo install cargo-fuzz`. Each target calls the same `fuzz_entry` function as the stable
# `#[ignore]` harness in the crate. Commands: docs/testing/fuzzing.md.
[package]
name = "darkclip-fuzz"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
darkclip-core = { path = "../crates/darkclip-core", features = ["fuzzing"] }
darkclip-app = { path = "../crates/darkclip-app", features = ["fuzzing"] }
darkclip-storage = { path = "../crates/darkclip-storage", features = ["fuzzing"] }
darkclip-windows = { path = "../crates/darkclip-windows", features = ["fuzzing"] }

# Its own workspace: never part of the product workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "sensitive"
path = "fuzz_targets/sensitive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transforms"
path = "fuzz_targets/transforms.rs"
test = false
doc = false
bench = false


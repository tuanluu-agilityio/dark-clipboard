<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Translate in place: prototype</title>
<style>
/* Design tokens: docs/specs/ui-redesign/02-design-system.md */
:root{
  --canvas:#111318; --surface:#1B2028; --raised:#232935; --selected:#262C45;
  --border:#2D3440; --border-strong:#4A5263;
  --text:#F3F5F9; --text-2:#A1AAB8; --text-3:#8F98A8;
  --accent:#7887FF; --on-accent:#111318; --focus:#9AA6FF;
  --success:#5FD4AA; --warning:#F2C14E; --danger:#FF7A85;
  --mono:Consolas, "Cascadia Mono", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0A0B0E;color:var(--text);font:13px/1.4 "Segoe UI","Segoe UI Variable",system-ui,sans-serif}
.page{max-width:1500px;margin:0 auto;padding:28px 32px 80px}
.page>header h1{font-size:20px;margin:0 0 4px}
.page>header p{color:var(--text-2);margin:0 0 6px;max-width:900px}
nav.toc{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 28px}
nav.toc a{color:var(--text-2);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px}
nav.toc a:hover{color:var(--text);border-color:var(--border-strong)}
section.shot{margin:0 0 48px}
section.shot>h2{font-size:15px;margin:0 0 4px}
section.shot>p.cap{color:var(--text-2);margin:0 0 14px;max-width:980px;font-size:12.5px}
.row{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.label{font-size:11px;color:var(--text-3);margin:0 0 6px;letter-spacing:.4px;text-transform:uppercase;font-weight:600}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i18{width:18px;height:18px}
svg.fill{fill:currentColor}

/* ---------- shared components ---------- */
.win{background:var(--canvas);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.titlebar{height:32px;display:flex;align-items:center;padding:0 10px;color:var(--text-3);font-size:12px;border-bottom:1px solid var(--border);gap:8px}
.titlebar .sp{flex:1}
.ib{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);flex:none;position:relative}
.ib:hover,.ib.hover{background:var(--raised);color:var(--text)}
.ib.on{color:var(--accent);background:var(--selected)}
.ib.danger:hover{color:var(--danger)}
.ib.focus{outline:2px solid var(--focus);outline-offset:1px}
.search{height:32px;flex:1;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;color:var(--text-3)}
.search.focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.search .q{color:var(--text);flex:1}
.search .q .caret{display:inline-block;width:1px;height:14px;background:var(--text);vertical-align:-2px;margin-left:1px}
.kc{display:inline-flex;align-items:center;gap:2px;height:18px;padding:0 5px;border-radius:4px;background:var(--raised);color:var(--text-2);font-size:11px;border:1px solid var(--border)}
.kc svg.i{width:12px;height:12px}
.seg{display:flex;gap:2px;padding:2px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}
.seg .t{height:26px;min-width:28px;padding:0 7px;border-radius:6px;display:flex;align-items:center;gap:5px;color:var(--text-2);font-size:12px}
.seg .t.on{background:var(--selected);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.seg .t.on svg{color:var(--accent)}
.seg .div{width:1px;background:var(--border);margin:4px 2px}
.overline{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--text-3);text-transform:uppercase;display:flex;align-items:center;gap:6px;padding:8px 12px 4px}
.overline .n{font-weight:400;letter-spacing:0}
.clip{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 10px;margin:0 6px;border-radius:6px;position:relative}
.clip:hover{background:var(--raised)}
.clip.sel{background:var(--selected)}
.clip.sel::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.clip .kind{width:28px;height:28px;border-radius:6px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:none}
.clip.sel .kind{background:var(--canvas);color:var(--accent)}
.clip .cb{flex:1;min-width:0}
.clip .pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.clip .pv.mono{font-family:var(--mono);font-size:12.5px}
.clip .pv mark{background:transparent;color:var(--accent);font-weight:600}
.clip .meta{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.clip .meta svg.i{width:12px;height:12px}
.clip .side{display:flex;align-items:center;gap:4px;color:var(--text-3);font-size:11px}
.clip .side .b{color:var(--text-2)}
.clip .side .b.star{color:var(--warning)}
.clip .side .b.lock{color:var(--danger)}
.clip .acts{display:flex;gap:2px}
.clip .num{min-width:16px;text-align:center}
.clip.masked .pv{color:var(--text-3);font-style:italic}
.status{height:30px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 10px;font-size:11px;color:var(--text-3)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.status .sp{flex:1}
.status .h{display:flex;align-items:center;gap:5px}
.toast{position:absolute;left:12px;right:12px;bottom:40px;height:36px;border-radius:8px;background:var(--raised);border:1px solid var(--border-strong);display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;font-size:12px}
.toast .sp{flex:1}
.toast .u{color:var(--accent);font-weight:600;display:flex;gap:6px;align-items:center;padding:0 8px;height:26px;border-radius:6px}
.tip{position:absolute;background:var(--raised);border:1px solid var(--border-strong);color:var(--text);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;display:flex;gap:8px;align-items:center;z-index:5}
.btn{height:32px;padding:0 14px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.danger{color:var(--danger)}
.chip{height:24px;padding:0 8px;border-radius:12px;display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text-2)}
.chip svg.i{width:12px;height:12px}

/* ---------- popup ---------- */
.popup{width:440px;height:520px;box-shadow:none}
.popup .head{display:flex;align-items:center;gap:4px;padding:10px 10px 8px}
.popup .filters{padding:0 10px 4px;display:flex;align-items:center;gap:6px}
.popup .list{flex:1;overflow:hidden;padding-bottom:6px}
.popup.wide{width:760px}
.popup .split{flex:1;display:flex;min-height:0}
.popup .split .left{width:440px;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.preview{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--canvas)}
.preview .ph{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border)}
.preview .ph .t{flex:1;font-weight:600}
.preview .pc{flex:1;padding:12px;overflow:hidden}
.preview pre{margin:0;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--text);white-space:pre-wrap}
.preview .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 12px;border-top:1px solid var(--border);font-size:12px}
.preview .facts dt{color:var(--text-3)} .preview .facts dd{margin:0;color:var(--text-2)}
.img-ph{height:170px;border-radius:8px;border:1px solid var(--border);background:
  linear-gradient(135deg,#2b3350 0%,#3a2f55 45%,#1f3b45 100%);display:flex;align-items:flex-end;padding:8px;color:var(--text-2);font-size:11px}

/* ---------- history ---------- */
.history{width:1060px;height:660px}
.history .body{flex:1;display:flex;min-height:0}
.side-nav{width:216px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:8px 8px}
.side-nav .brand{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:600}
.side-nav .brand .logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.nav{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:6px;color:var(--text-2);position:relative}
.nav .n{margin-left:auto;font-size:11px;color:var(--text-3)}
.nav:hover{background:var(--raised);color:var(--text)}
.nav.on{background:var(--selected);color:var(--text)}
.nav.on svg{color:var(--accent)}
.nav.on::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent)}
.nav .sw{width:9px;height:9px;border-radius:3px;flex:none}
.side-nav .grp{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--text-3);text-transform:uppercase;padding:14px 8px 4px;display:flex;align-items:center}
.side-nav .grp .ib{width:22px;height:22px;margin-left:auto}
.side-nav .sp{flex:1}
.mid{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border)}
.toolbar .tt{font-weight:600;font-size:15px;margin-right:8px}
.dd{height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--border);border-radius:6px;color:var(--text-2);font-size:12px}
.mid .list{flex:1;overflow:hidden;padding:4px 0}
.mid .clip{height:56px}
.mid .clip .pv2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2);font-size:12px}
.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk.on svg{width:12px;height:12px;stroke-width:3}
.detail{width:340px;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.detail .dh{display:flex;align-items:center;gap:2px;padding:10px 10px;border-bottom:1px solid var(--border)}
.detail .dh .sp{flex:1}
.detail .dc{padding:12px;overflow:hidden;flex:1;display:flex;flex-direction:column;gap:14px}
.detail .box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;max-height:170px;overflow:hidden}
.detail h4{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--text-3);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.detail .tags{display:flex;gap:6px;flex-wrap:wrap}
.detail .note{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text-2);font-size:12.5px}
.facts2{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.facts2 dt{color:var(--text-3)} .facts2 dd{margin:0;color:var(--text-2)}
.bulk{display:flex;align-items:center;gap:4px;margin:8px 12px 4px;padding:4px 6px 4px 12px;height:40px;background:var(--selected);border:1px solid var(--accent);border-radius:8px}
.bulk .t{font-weight:600;margin-right:auto}
.menu{position:absolute;width:236px;background:var(--raised);border:1px solid var(--border-strong);border-radius:10px;padding:4px;z-index:6}
.menu .mi{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:6px;color:var(--text)}
.menu .mi svg{color:var(--text-2)}
.menu .mi.hl{background:var(--selected);outline:2px solid var(--focus);outline-offset:-2px}
.menu .mi .k{margin-left:auto;font-size:11px;color:var(--text-3)}
.menu .mi.d{color:var(--danger)} .menu .mi.d svg{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 2px}
.narrow{width:720px;height:560px}
.rail{width:52px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
.rail .ib{width:36px;height:36px}
.rail .ib.on{box-shadow:inset 3px 0 0 var(--accent)}
.rail hr{width:24px;border:0;border-top:1px solid var(--border);margin:6px 0}

/* ---------- settings ---------- */
.settings{width:860px;height:640px}
.settings .body{flex:1;display:flex;min-height:0}
.settings .side-nav{width:220px}
.settings .content{flex:1;overflow:hidden;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.settings h3{margin:0;font-size:18px}
.settings .sub{color:var(--text-2);margin:2px 0 0;font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.card .ct{padding:10px 14px 4px;font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--text-3);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:44px}
.srow+.srow{border-top:1px solid var(--border)}
.srow .lb{flex:1;min-width:0}
.srow .lb .l{color:var(--text)}
.srow .lb .d{color:var(--text-3);font-size:12px}
.srow .lk{color:var(--success)}
.sw2{width:34px;height:20px;border-radius:10px;background:var(--border-strong);position:relative;flex:none}
.sw2::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--text-2)}
.sw2.on{background:var(--accent)} .sw2.on::after{left:17px;background:var(--on-accent)}
.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 14px 14px}
.mode .m{border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--canvas)}
.mode .m .h{display:flex;align-items:center;gap:8px;font-weight:600}
.mode .m .d{color:var(--text-3);font-size:12px}
.mode .m.on{border-color:var(--accent);background:var(--selected)}
.mode .m.on .h svg{color:var(--success)}
.app{display:flex;align-items:center;gap:10px;padding:8px 14px}
.app+.app{border-top:1px solid var(--border)}
.app .ico{width:24px;height:24px;border-radius:6px;background:var(--raised);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.app .nm{flex:1} .app .by{font-size:11px;color:var(--text-3);display:flex;gap:4px;align-items:center}
.savebar{display:flex;align-items:center;gap:8px;padding:10px 24px;border-top:1px solid var(--border);background:var(--surface)}
.savebar .dot{width:7px;height:7px;border-radius:50%;background:var(--warning)}
.savebar .t{flex:1;color:var(--text-2);font-size:12px;display:flex;gap:8px;align-items:center}
.select{height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--border-strong);border-radius:6px;background:var(--canvas);font-size:12px;min-width:150px;justify-content:space-between}

/* ---------- components sheet ---------- */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tile{background:var(--canvas);border:1px solid var(--border);border-radius:10px;padding:14px}
.tile h5{margin:0 0 10px;font-size:12px;color:var(--text-2);font-weight:600}
.sw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.swatch{height:44px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:4px;font-size:10px;color:var(--text-2)}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;color:var(--text-2)}
.icons div{display:flex;justify-content:center}
.note-box{border-left:3px solid var(--accent);padding:6px 12px;color:var(--text-2);font-size:12.5px;background:var(--surface);border-radius:0 6px 6px 0;max-width:980px;margin:0 0 14px}
</style>
</head><body>

.ov.err{border-color:var(--danger)} .ov.err .ic{color:var(--danger)}

let L="vi", enabled=true, hasKey=true, original=null, timer=null, busy=false;
const $=id=>document.getElementById(id), ta=$("ta"), ov=$("ov");
function tr(k){return T[L][k]}
function render(){
  document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(e=>{const v=tr(e.dataset.t); if(typeof v==="string") e.innerHTML=v;});
  document.querySelectorAll("[data-state]").forEach(e=>e.textContent=tr("st_"+e.dataset.state));
  $("lang-vi").classList.toggle("sel",L==="vi"); $("lang-en").classList.toggle("sel",L==="en");
  renderSettings();
}
function renderSettings(){
  $("sw").classList.toggle("on",enabled);
  $("cfg").classList.toggle("disabled-card",!enabled); $("keycard").classList.toggle("disabled-card",!enabled);
  $("keyStatus").innerHTML = hasKey?`<span class="st-ok"><svg class="i" style="width:12px;height:12px"><use href="#check"/></svg>${tr("keyHave")}</span>`:`<span class="st-no">${tr("keyNone")}</span>`;
  $("keyEdit").style.display=hasKey?"none":"flex"; $("keyHave").style.display=hasKey?"flex":"none";
}
function show(kind,icon,main,sub,ms){
  clearTimeout(timer);
  ov.className="ov show "+kind;
  ov.innerHTML=(icon==="spin"?'<span class="spin"></span>':`<svg class="i ic"><use href="#${icon}"/></svg>`)+`<div class="tx"><div>${main}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`;
  const r=ta.getBoundingClientRect(), c=$("composer").getBoundingClientRect();
  ov.style.left=(r.left-c.left+24)+"px"; ov.style.top=(r.top-c.top-ov.offsetHeight-8)+"px";
  if(ms) timer=setTimeout(()=>{ov.className="ov"},ms);
}
function selectedOrAll(){const s=ta.selectionStart,e=ta.selectionEnd; return s!==e?[s,e]:[0,ta.value.length]}
function translate(delay=1300, fail=null){
  if(busy) return;
  if(!enabled) return show("warn","alert",tr("ovOff"),tr("ovOffS"),3000);
  const [s,e]=selectedOrAll(), text=ta.value.slice(s,e);
  if(!text.trim()) return;
  busy=true; ta.focus();
  show("","spin",tr("ovSending")(text.length),tr("ovEsc"));
  timer=setTimeout(()=>{
    busy=false;
    if(fail==="net") return show("err","alert",tr("ovNet"),tr("ovNetS"),5000);
    if(fail==="focus") return show("warn","alert",tr("ovFocus"),tr("ovFocusS"),5000);
    const out = text.trim()===T.vi.sample.trim()? T.vi.translated : tr("mockOther");
    original=ta.value;
    ta.focus(); ta.setSelectionRange(s,e);
    // replace as an undoable edit, like a real Ctrl+V
    if(!document.execCommand || !document.execCommand("insertText",false,out)) ta.value=ta.value.slice(0,s)+out+ta.value.slice(e);
    show("ok","check",tr("ovDone"),tr("ovDoneS"),3500);
  },delay);
}
function cancel(){ if(!busy) return; clearTimeout(timer); busy=false; show("","x",tr("ovCancel"),"",2000); }
document.addEventListener("keydown",ev=>{
  if(ev.ctrlKey && ev.altKey && (ev.key==="t"||ev.key==="T")){ev.preventDefault(); translate();}
  else if(ev.key==="Escape") cancel();
});
document.querySelectorAll("[data-state]").forEach(b=>b.onclick=()=>{
  const s=b.dataset.state;
  if(s==="ok") translate();
  else if(s==="slow") translate(6000);
  else if(s==="off"){const was=enabled; enabled=false; translate(); enabled=was;}
  else if(s==="excluded") show("err","lock",tr("ovExcl"),tr("ovExclS"),4500);
  else if(s==="secret") show("err","shield",tr("ovSecret"),tr("ovSecretS"),4500);
  else if(s==="focus") translate(1300,"focus");
  else if(s==="private") show("warn","eyeoff",tr("ovPriv"),tr("ovPrivS"),4500);
  else if(s==="net") translate(1300,"net");
  else if(s==="reset"){ta.value=tr("sample"); ov.className="ov";}
});
$("sw").onclick=()=>{ if(enabled){enabled=false; renderSettings();} else $("consent").classList.add("show"); };
$("cNo").onclick=()=>$("consent").classList.remove("show");
$("cYes").onclick=()=>{enabled=true; $("consent").classList.remove("show"); renderSettings();};
$("keySave").onclick=()=>{ if($("keyIn").value.trim()){hasKey=true; $("keyIn").value=""; renderSettings();} };
$("keyRemove").onclick=()=>{hasKey=false; renderSettings();};
$("keyReplace").onclick=()=>{hasKey=false; renderSettings(); $("keyIn").focus();};
$("testBtn").onclick=()=>{ $("testOut").textContent = hasKey? "…" : tr("testNoKey"); if(hasKey) setTimeout(()=>$("testOut").textContent=tr("testOk"),1200); };
$("lang-vi").onclick=()=>{L="vi";render()}; $("lang-en").onclick=()=>{L="en";render()};
ta.value=T.vi.sample; render();
</script>

[package]
name = "translate-hotkey-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway spike (P2 AI feasibility). Not a workspace member. See README.md.
[workspace]

[dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Diagnostics_Debug",
] }
